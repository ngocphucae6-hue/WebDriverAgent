name: Build WebDriverAgentRunner
on:
  workflow_dispatch:
  push:
    branches: [master, main]

env:
  CI_BUNDLE_ID: com.xcode.testvnaffapi.vip
  CI_TEAM_ID: 5993KYB2L9
  CI_PROFILE_NAME: AllNaffa2
  CI_P12_PASSWORD: 123

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles/
          echo '${{ secrets.IOS_PROVISIONING_PROFILE }}' | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
          security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision > /tmp/profile.plist
          echo "Profile installed successfully"

      - name: Setup signing certificate
        run: |
          echo '${{ secrets.IOS_CERTIFICATE_P12 }}' | base64 -d > /tmp/cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p ci $KEYCHAIN_PATH
          security set-keychain-settings -lut 7200 $KEYCHAIN_PATH
          security unlock-keychain -p ci $KEYCHAIN_PATH
          security import /tmp/cert.p12 -k $KEYCHAIN_PATH -P "$CI_P12_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci $KEYCHAIN_PATH
          security find-identity -v -p codesigning

      - name: Patch bundle ID to match provisioning profile
        run: |
          find . -name "*.pbxproj" -exec sed -i '' "s/com\\.facebook\\.WebDriverAgentRunner/$CI_BUNDLE_ID/g; s/com\\.facebook\\.WebDriverAgentLib/$CI_BUNDLE_ID.lib/g" {} +
          find . -name "*.xcscheme" -exec sed -i '' "s/com\\.facebook\\.WebDriverAgentRunner/$CI_BUNDLE_ID/g; s/com\\.facebook\\.WebDriverAgentLib/$CI_BUNDLE_ID.lib/g" {} +
          find . -name "*.plist" -not -path "*/Pods/*" -exec sed -i '' "s/com\\.facebook\\.WebDriverAgentRunner/$CI_BUNDLE_ID/g; s/com\\.facebook\\.WebDriverAgentLib/$CI_BUNDLE_ID.lib/g" {} +
          plutil -replace CFBundleIdentifier -string "$CI_BUNDLE_ID" WebDriverAgentRunner/Info.plist
          plutil -replace CFBundleIdentifier -string "$CI_BUNDLE_ID.lib" WebDriverAgentLib/Info.plist
          echo "Bundle IDs patched to $CI_BUNDLE_ID"

      - name: Build WebDriverAgentRunner
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" 2>&1 | tee build.log

      - name: Re-sign runner app with provided development profile
        run: |
          set -euo pipefail
          security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision > /tmp/profile.plist
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' /tmp/profile.plist > /tmp/entitlements.plist
          IDENTITY=$(security find-identity -v -p codesigning | awk -F '"' '/Apple Development/ {print $2; exit}')
          if [ -z "$IDENTITY" ]; then
            echo "No Apple Development signing identity found"
            security find-identity -v -p codesigning
            exit 1
          fi
          APP=$(find build/DerivedData -type d -name "*.app" | head -n 1)
          if [ -z "$APP" ]; then
            echo "No runner .app found before signing"
            find build/DerivedData -maxdepth 8 -print
            exit 1
          fi
          echo "Signing app: $APP"
          plutil -replace CFBundleIdentifier -string "$CI_BUNDLE_ID" "$APP/Info.plist"
          find "$APP" -type d -name "*.dSYM" -print -prune -exec rm -rf {} \;
          if [ -d "$APP/PlugIns/WebDriverAgentRunner.xctest" ]; then
            plutil -replace CFBundleIdentifier -string "$CI_BUNDLE_ID.xctest" "$APP/PlugIns/WebDriverAgentRunner.xctest/Info.plist"
          fi
          cp ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision "$APP/embedded.mobileprovision"
          find "$APP" -type d \( -name "*.framework" -o -name "*.xctest" -o -name "*.appex" \) -print0 | while IFS= read -r -d '' item; do
            echo "Signing nested: $item"
            codesign --force --sign "$IDENTITY" --timestamp=none "$item"
          done
          codesign --force --sign "$IDENTITY" --entitlements /tmp/entitlements.plist --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          for xctestrun in $(find build/DerivedData -type f -name "*.xctestrun"); do
            echo "Patching xctestrun: $xctestrun"
            plutil -convert xml1 "$xctestrun"
            sed -i '' "s/$CI_BUNDLE_ID\.xctrunner/$CI_BUNDLE_ID/g" "$xctestrun"
            plutil -convert binary1 "$xctestrun" || true
          done

      - name: Package artifact
        run: |
          mkdir -p build/artifacts
          echo "=== Built app candidates ==="
          find build/DerivedData -type d -name "*.app" -print || true
          echo "=== xctestrun candidates ==="
          find build/DerivedData -type f -name "*.xctestrun" -print || true
          find build/DerivedData -type f -name "*.xctestrun" -exec cp {} build/artifacts/ \;
          while IFS= read -r app; do
            [ -z "$app" ] && continue
            name=$(basename "$app")
            echo "Copying app: $app -> build/artifacts/$name"
            ditto "$app" "build/artifacts/$name"
          done < <(find build/DerivedData -type d -name "*.app" -print)
          cp build.log build/artifacts/build.log || true
          if [ -z "$(find build/artifacts -mindepth 1 -print -quit)" ]; then
            echo "No artifacts found. DerivedData contents:"
            find build/DerivedData -maxdepth 8 -print
            exit 1
          fi
          cd build/artifacts
          ls -la
          zip -r WebDriverAgentRunner.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgentRunner
          path: build/artifacts/
          retention-days: 3

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 3
