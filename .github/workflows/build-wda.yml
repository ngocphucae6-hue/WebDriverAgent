name: Build WebDriverAgentRunner
on:
  workflow_dispatch:
  push:
    branches: [master, main]

env:
  CI_BUNDLE_ID: com.20251224.11
  CI_TEAM_ID: H4AD2QD4W8
  CI_PROFILE_NAME: AllDevices_alex67chinii_talzm_com_20251224_221344
  CI_P12_PASSWORD: 123

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles/
          echo '${{ secrets.IOS_PROVISIONING_PROFILE }}' | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
          security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision > /tmp/profile.plist
          echo "Profile installed successfully"

      - name: Setup signing certificate
        run: |
          echo '${{ secrets.IOS_CERTIFICATE_P12 }}' | base64 -d > /tmp/cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p ci $KEYCHAIN_PATH
          security set-keychain-settings -lut 7200 $KEYCHAIN_PATH
          security unlock-keychain -p ci $KEYCHAIN_PATH
          security import /tmp/cert.p12 -k $KEYCHAIN_PATH -P "$CI_P12_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci $KEYCHAIN_PATH
          security find-identity -v -p codesigning

      - name: Patch bundle ID to match provisioning profile
        run: |
          # Change WebDriverAgentRunner's bundle ID
          find . -path "*/WebDriverAgentRunner/Info.plist" -exec plutil -replace CFBundleIdentifier -string "$CI_BUNDLE_ID" {} \;
          # Change the test runner bundle ID
          find . -path "*/WebDriverAgentRunner.xctest/Info.plist" -exec plutil -replace CFBundleIdentifier -string "$CI_BUNDLE_ID.xctrunner" {} \;
          # Find and patch any xcscheme or pbxproj references
          find . -name "*.pbxproj" -exec sed -i '' "s/com\\.facebook\\.WebDriverAgentRunner/$CI_BUNDLE_ID/g" {} +
          find . -name "*.xcscheme" -exec sed -i '' "s/com\\.facebook\\.WebDriverAgentRunner/$CI_BUNDLE_ID/g" {} +
          find . -name "*.plist" -not -path "*/Pods/*" -exec sed -i '' "s/com\\.facebook\\.WebDriverAgentRunner/$CI_BUNDLE_ID/g" {} +
          echo "Bundle IDs patched to $CI_BUNDLE_ID"

      - name: Build WebDriverAgentRunner
        run: |
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$CI_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$CI_PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER="$CI_BUNDLE_ID" 2>&1 | tee build.log

      - name: Package artifact
        run: |
          mkdir -p build/artifacts
          echo "=== Built app candidates ==="
          find build/DerivedData -type d -name "*.app" -print || true
          echo "=== xctestrun candidates ==="
          find build/DerivedData -type f -name "*.xctestrun" -print || true
          find build/DerivedData -type f -name "*.xctestrun" -exec cp {} build/artifacts/ \;
          while IFS= read -r app; do
            [ -z "$app" ] && continue
            name=$(basename "$app")
            echo "Copying app: $app -> build/artifacts/$name"
            ditto "$app" "build/artifacts/$name"
          done < <(find build/DerivedData -type d -name "*.app" -print)
          cp build.log build/artifacts/build.log || true
          if [ -z "$(find build/artifacts -mindepth 1 -print -quit)" ]; then
            echo "No artifacts found. DerivedData contents:"
            find build/DerivedData -maxdepth 8 -print
            exit 1
          fi
          cd build/artifacts
          ls -la
          zip -r WebDriverAgentRunner.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgentRunner
          path: build/artifacts/
          retention-days: 3

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 3
