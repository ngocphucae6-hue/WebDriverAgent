name: Sign Game IPA
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: 'Release tag containing the IPA'
        required: true
        default: 'stickerroom-input'

env:
  CI_BUNDLE_ID: com.xcode.testvnaffapi.vip
  CI_TEAM_ID: 5993KYB2L9
  CI_P12_PASSWORD: 123

jobs:
  sign:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download IPA from release
        run: |
          gh release download "${{ github.event.inputs.release_id }}" --repo ngocphucae6-hue/WebDriverAgent --pattern "*.ipa" --dir /tmp/ipa_download 2>&1
          mv /tmp/ipa_download/*.ipa input.ipa
          ls -la input.ipa
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Setup provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles/
          echo '${{ secrets.IOS_PROVISIONING_PROFILE }}' | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Setup signing certificate
        run: |
          echo '${{ secrets.IOS_CERTIFICATE_P12 }}' | base64 -d > /tmp/cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p ci $KEYCHAIN_PATH
          security set-keychain-settings -lut 7200 $KEYCHAIN_PATH
          security unlock-keychain -p ci $KEYCHAIN_PATH
          security import /tmp/cert.p12 -k $KEYCHAIN_PATH -P "$CI_P12_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci $KEYCHAIN_PATH
          CERT_IDENTITY=$(security find-identity -v -p codesigning | grep "Apple Development" | head -1 | awk '{print $2}')
          echo "CERT_IDENTITY=$CERT_IDENTITY" >> $GITHUB_ENV

      - name: Extract and prepare IPA
        run: |
          unzip -q input.ipa -d extracted/
          APP_PATH=$(find extracted -name "*.app" -type d | head -1)
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      - name: Patch bundle ID
        run: |
          plutil -replace CFBundleIdentifier -string "$CI_BUNDLE_ID" "$APP_PATH/Info.plist"

      - name: Extract entitlements
        run: |
          python3 -c "
import os, plistlib, subprocess
home = os.path.expanduser('~')
subprocess.run(['security', 'cms', '-D', '-i', home + '/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision', '-o', '/tmp/profile.plist'], check=True)
with open('/tmp/profile.plist', 'rb') as f:
    profile = plistlib.load(f)
ent = profile['Entitlements']
team = profile.get('TeamIdentifier', [''])[0]
ent['application-identifier'] = team + '.' + os.environ['CI_BUNDLE_ID']
with open('/tmp/entitlements.plist', 'wb') as f:
    plistlib.dump(ent, f)
print('OK entitlements:', list(ent.keys()))
" 2>&1

      - name: Sign with native codesign
        run: |
          find "$APP_PATH" -name "*.framework" -type d | while read fw; do
            codesign -f -s "$CERT_IDENTITY" --timestamp=none "$fw" 2>&1
          done
          find "$APP_PATH" -name "*.dylib" | while read dylib; do
            codesign -f -s "$CERT_IDENTITY" --timestamp=none "$dylib" 2>&1
          done
          codesign -f -s "$CERT_IDENTITY" --timestamp=none --entitlements /tmp/entitlements.plist "$APP_PATH" 2>&1
          codesign -dvvv "$APP_PATH" 2>&1

      - name: Repackage as IPA
        run: |
          cd extracted && zip -q -r ../signed.ipa Payload/

      - uses: actions/upload-artifact@v4
        with:
          name: SignedGameIPA
          path: signed.ipa
          retention-days: 3