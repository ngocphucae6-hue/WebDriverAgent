name: Sign Game IPA
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: 'Release ID containing the IPA'
        required: true
        default: 'untagged-4f83f354a600d07f00c4'

env:
  CI_BUNDLE_ID: com.xcode.testvnaffapi.vip
  CI_TEAM_ID: 5993KYB2L9
  CI_P12_PASSWORD: 123

jobs:
  sign:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download IPA from release
        run: |
          gh release download "${{ github.event.inputs.release_id }}" --repo ngocphucae6-hue/WebDriverAgent --pattern "*.ipa" 2>&1 || \
          curl -sL "$(gh api repos/ngocphucae6-hue/WebDriverAgent/releases/tags/${{ github.event.inputs.release_id }} --jq '.assets[0].url' 2>/dev/null)" -H "Accept: application/octet-stream" -L -o input.ipa
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Setup provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles/
          echo '${{ secrets.IOS_PROVISIONING_PROFILE }}' | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
          echo "Provision profile set up"

      - name: Setup signing certificate
        run: |
          echo '${{ secrets.IOS_CERTIFICATE_P12 }}' | base64 -d > /tmp/cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p ci $KEYCHAIN_PATH
          security set-keychain-settings -lut 7200 $KEYCHAIN_PATH
          security unlock-keychain -p ci $KEYCHAIN_PATH
          security import /tmp/cert.p12 -k $KEYCHAIN_PATH -P "$CI_P12_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci $KEYCHAIN_PATH
          CERT_IDENTITY=$(security find-identity -v -p codesigning | grep "Apple Development" | head -1 | awk '{print $2}')
          echo "CERT_IDENTITY=$CERT_IDENTITY" >> $GITHUB_ENV
          echo "Certificate identity: $CERT_IDENTITY"

      - name: Extract and prepare IPA
        run: |
          unzip -q input.ipa -d extracted/
          APP_PATH=$(find extracted -name "*.app" -type d | head -1)
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      - name: Patch bundle ID
        run: |
          plutil -replace CFBundleIdentifier -string "$CI_BUNDLE_ID" "$APP_PATH/Info.plist"
          echo "Bundle ID set to $CI_BUNDLE_ID"

      - name: Extract entitlements from provisioning profile
        run: |
          security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision > /tmp/profile.plist
          /usr/libexec/PlistBuddy -c "Print :Entitlements" /tmp/profile.plist > /tmp/entitlements.plist 2>&1 || true
          plutil -replace application-identifier -string "${CI_TEAM_ID}.${CI_BUNDLE_ID}" /tmp/entitlements.plist 2>/dev/null || true
          echo "Entitlements extracted"

      - name: Sign with native codesign
        run: |
          # Sign all frameworks
          find "$APP_PATH" -name "*.framework" -type d | while read fw; do
            echo "Signing framework: $(basename $fw)"
            codesign -f -s "$CERT_IDENTITY" --timestamp=none "$fw" 2>&1
          done

          # Sign all dylibs
          find "$APP_PATH" -name "*.dylib" | while read dylib; do
            echo "Signing dylib: $(basename $dylib)"
            codesign -f -s "$CERT_IDENTITY" --timestamp=none "$dylib" 2>&1
          done

          # Sign main app
          echo "Signing main app..."
          codesign -f -s "$CERT_IDENTITY" --timestamp=none --entitlements /tmp/entitlements.plist "$APP_PATH" 2>&1

          # Verify
          codesign -dvvv "$APP_PATH" 2>&1 || true

      - name: Repackage as IPA
        run: |
          cd extracted && zip -q -r ../signed.ipa Payload/

      - uses: actions/upload-artifact@v4
        with:
          name: SignedGameIPA
          path: signed.ipa
          retention-days: 3
